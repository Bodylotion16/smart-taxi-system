<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Betaling Voltooien | Smart Taxi
    </title>

    <link
        rel="stylesheet"
        href="../css/payment.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body>

    <div class="payment-container">

        <h1>Betaling</h1>

        <p class="subtitle">
            Bevestig uw betaling om de rit af te sluiten.
        </p>

        <div class="payment-box">

            <span class="status-badge">
                Wachten op betaling
            </span>

            <div class="price-display">

                SRD

                <span id="amountDisplay">
                    0.00
                </span>

            </div>

            <div class="detail-row">

                <span>
                    Rit ID (booking_id):
                </span>

                <span
                    id="bookingIdDisplay"
                    class="highlight-text"
                >
                    #0
                </span>

            </div>

            <div class="detail-row">

                <span>
                    Methode (payment_method):
                </span>

                <span
                    id="methodDisplay"
                    class="method-text"
                >
                    CASH
                </span>

            </div>

            <div class="detail-row">

                <span>
                    Datum:
                </span>

                <span id="dateDisplay">
                    --/--/----
                </span>

            </div>

        </div>

        <div class="payment-actions">

            <button
                id="payButton"
                onclick="verwerkBetaling()"
                class="pay-btn"
            >
                Bevestig Betaling
            </button>

            <p id="successMessage">
                ✅ Betaling Succesvol Verwerkt!
            </p>

            <p class="footer-text">
                Hulp nodig? Neem contact op met support.
            </p>

        </div>

    </div>

    <script src="../js/payment.js"></script>

</body>
</html>
