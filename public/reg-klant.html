<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Klant Registratie - Smart Taxi</title>
</head>
<body style="justify-content:center; align-items:center; display:flex;">
    <div class="login-container" style="max-width: 500px; text-align: left;">
        <h1>Passagier Worden</h1>
        <p class="subtitle">Maak een account aan om ritten te boeken.</p>

        <form id="klantRegForm">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="first_name" placeholder="Voornaam" required>
                <input type="text" id="last_name" placeholder="Achternaam" required>
            </div>
            
            <input type="email" id="email" placeholder="E-mailadres" required>
            <input type="tel" id="phone_number" placeholder="Telefoonnummer" required>
            <input type="text" id="address" placeholder="Woonadres" required>
            <input type="password" id="password" placeholder="Wachtwoord" required>

            <button type="submit">Account Aanmaken</button>
            <p class="footer-text">Al een account? <a href="index.html">Log hier in</a></p>
        </form>
    </div>

    <script>
        document.getElementById('klantRegForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // FIX: De ID's tussen de haakjes matchen nu EXACT met de id="..." uit je HTML hierboven!
            const formData = {
                voornaam: document.getElementById('first_name').value,
                achternaam: document.getElementById('last_name').value,
                email: document.getElementById('email').value,
                telefoon: document.getElementById('phone_number').value,
                adres: document.getElementById('address').value,
                wachtwoord: document.getElementById('password').value,
                rol: 'klant' // Matcht met de ENUM in de database ('klant')
            };

            const response = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(formData)
            });

            const result = await response.json();
            if(result.success) {
                alert("Welkom! Je kunt nu inloggen.");
                window.location.href = 'index.html';
            } else {
                alert("Fout bij aanmaken user: " + result.message);
            }
        });
    </script>
</body>
</html>
