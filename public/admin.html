<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Systeem Beheer | Smart Taxi</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #000; font-family: 'Inter', sans-serif; margin: 0; display: flex; color: #fff; height: 100vh; overflow: hidden; }
        
        /* Sidebar Styling behouden van je screenshot */
        .sidebar { width: 250px; background: #0a0a0a; border-right: 1px solid #1f1f1f; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        .sidebar h2 { color: #f1c40f; font-weight: 800; font-size: 1.5rem; margin-top: 0; text-transform: uppercase; }
        .menu-list { list-style: none; padding: 0; margin: 0; }
        .menu-item { padding: 12px 15px; border-radius: 8px; cursor: pointer; color: #ccc; font-weight: 700; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; transition: 0.2s; }
        .menu-item:hover, .menu-item.active { background: rgba(241, 196, 15, 0.1); color: #f1c40f; }
        .logout { color: #e74c3c; font-weight: 700; cursor: pointer; padding: 12px 15px; }

        /* Rechter Content Gebied */
        .content-area { flex: 1; padding: 40px; box-sizing: border-box; overflow-y: auto; background: #111; }
        
        /* Dashboard Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #222; border-left: 4px solid #f1c40f; }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: #ccc; text-transform: uppercase; }
        .stat-card p { margin: 0; font-size: 1.8rem; font-weight: 800; color: #fff; }

        /* Algemene Tabel Layout */
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #1a1a1a; border-radius: 8px; overflow: hidden; }
        .admin-table th, .admin-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #222; }
        .admin-table th { background: #222; color: #f1c40f; font-weight: 700; }
        
        /* Status Badges */
        .badge { padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        .badge.pending { background: #f1c40f; color: #000; }
        .badge.paid { background: #2ecc71; color: #fff; }
        .badge.accepted { background: #3498db; color: #fff; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <h2>Smart Admin</h2>
            <ul class="menu-list">
                <li class="menu-item active" onclick="switchTab('dashboard', this)">📟 Dashboard</li>
                <li class="menu-item" onclick="switchTab('chauffeurs', this)">Taxi Chauffeurs</li>
                <li class="menu-item" onclick="switchTab('klanten', this)">👥 Klanten</li>
                <li class="menu-item" onclick="switchTab('live-ritten', this)">🗺️ Live Ritten</li>
                <li class="menu-item" onclick="switchTab('financien', this)">💰 Financiën</li>
            </ul>
        </div>
        <div class="logout" onclick="window.location.href='index.html'">🚪 Uitloggen</div>
    </div>

    <div class="content-area" id="main-content">
        <h2>Systeemgegevens aan het opvragen...</h2>
    </div>

    <script>
        let adminData = {};

        // 1. Haal alle live data op van de server
        async function fetchAdminData() {
            try {
                const response = await fetch('/api/admin/dashboard');
                const result = await response.json();
                
                const content = document.getElementById('main-content');
                
                if (result.success) {
                    adminData = result;
                    
                    // FIX: Bepaal welk tabblad nu actief is en teken het direct op het scherm!
                    const activeMenu = document.querySelector('.menu-item.active');
                    if (activeMenu) {
                        // We filteren gekke tekens of emoji's uit de tekst om de tabnaam te matchen
                        const tabName = activeMenu.innerText.replace(/[^\w\s]/gi, '').trim().toLowerCase();
                        renderTab(tabName);
                    }
                } else {
                    // Mocht je SQL query crashen in server.js, dan zie je nu EXACT waarom op je scherm
                    content.innerHTML = `
                        <h2 style="color: #e74c3c;">❌ Database Fout</h2>
                        <p>De database weigert de statistieken te leveren:</p>
                        <pre style="background: #222; padding: 15px; border-radius: 8px; color: #ff4d4d;">${result.message}</pre>
                    `;
                }
            } catch (err) {
                console.error("Fout bij laden admin gegevens:", err);
                document.getElementById('main-content').innerHTML = `
                    <h2 style="color: #e74c3c;">❌ Verbindingsfout</h2>
                    <p>Kan de data niet ophalen. Let op: je moet deze pagina openen via <strong>http://localhost:3000/admin.html</strong> en NIET via dubbelklik op het bestand!</p>
                `;
            }
        }

        // 2. Wisselen tussen de menu tabs
        function switchTab(tabName, element) {
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            renderTab(tabName);
        }

        // 3. Bouw de HTML op basis van het gekozen tabblad
        function renderTab(tab) {
            const content = document.getElementById('main-content');
            
            // Veiligheidscheck: als de data nog niet binnen is van de database
            if (!adminData.stats) {
                content.innerHTML = "<h2>Gegevens worden geladen...</h2>";
                return;
            }

            if (tab === 'dashboard') {
                const rittenCount = adminData.stats.totaal_ritten || 0;
                const omzetSum = adminData.stats.totale_omzet ? parseFloat(adminData.stats.totale_omzet).toFixed(2) : "0.00";
                const chauffeursCount = adminData.chauffeurs ? adminData.chauffeurs.length : 0;

                content.innerHTML = `
                    <h1>📟 Systeem Overzicht</h1>
                    <div class="stats-grid">
                        <div class="stat-card"><h3>Voltooide Ritten</h3><p>${rittenCount}</p></div>
                        <div class="stat-card"><h3>Totale Omzet</h3><p>SRD ${omzetSum}</p></div>
                        <div class="stat-card"><h3>Chauffeurs</h3><p>${chauffeursCount}</p></div>
                    </div>
                    <h3>Actieve ritten of wachtende klanten (Top 5):</h3>
                    ${renderRittenTabel(adminData.liveRitten.slice(0, 5))}
                `;
            } 
            else if (tab === 'chauffeurs' || tab === 'taxi chauffeurs') {
                let rows = adminData.chauffeurs.map(c => `
                    <tr>
                        <td>ID #${c.id}</td>
                        <td>${c.first_name} ${c.last_name}</td>
                        <td>${c.phone_number || 'Geen'}</td>
                        <td><strong style="color: #f1c40f;">${c.kenteken || 'Onbekend'}</strong></td>
                        <td>${c.auto_model || 'Onbekend'}</td>
                    </tr>
                `).join('');
                
                content.innerHTML = `
                    <h1>🚕 Geregistreerde Chauffeurs</h1>
                    <table class="admin-table">
                        <thead><tr><th>ID</th><th>Naam</th><th>Telefoon</th><th>Kenteken</th><th>Auto Model</th></tr></thead>
                        <tbody>${rows || '<tr><td colspan="5">Geen chauffeurs in database gevonden.</td></tr>'}</tbody>
                    </table>
                `;
            } 
            else if (tab === 'klanten') {
                let rows = adminData.klanten.map(k => `
                    <tr>
                        <td>ID #${k.id}</td>
                        <td>${k.first_name} ${k.last_name}</td>
                        <td>${k.email}</td>
                        <td>${k.phone_number || 'Geen'}</td>
                        <td>${k.address || 'Geen adres ingevuld'}</td>
                    </tr>
                `).join('');

                content.innerHTML = `
                    <h1>👥 Geregistreerde Klanten</h1>
                    <table class="admin-table">
                        <thead><tr><th>ID</th><th>Naam</th><th>E-mail</th><th>Telefoon</th><th>Woonadres</th></tr></thead>
                        <tbody>${rows || '<tr><td colspan="5">Geen klanten in database gevonden.</td></tr>'}</tbody>
                    </table>
                `;
            } 
            else if (tab === 'live-ritten' || tab === 'live ritten') {
                content.innerHTML = `
                    <h1>🗺️ Live Ritten Volgen</h1>
                    <p>Hieronder zie je alle ritten die momenteel zijn aangevraagd, betaald of in behandeling zijn:</p>
                    ${renderRittenTabel(adminData.liveRitten)}
                `;
            } 
            else if (tab === 'financien' || tab === 'financiën') {
                const omzetSum = adminData.stats.totale_omzet ? parseFloat(adminData.stats.totale_omzet).toFixed(2) : "0.00";
                content.innerHTML = `
                    <h1>💰 Financiële Rapporten</h1>
                    <div class="stats-grid">
                        <div class="stat-card" style="border-left-color: #2ecc71;">
                            <h3>Bruto Omzet</h3>
                            <p>SRD ${omzetSum}</p>
                        </div>
                        <div class="stat-card" style="border-left-color: #3498db;">
                            <h3>Aantal ritten afgerekend</h3>
                            <p>${adminData.stats.totaal_ritten || 0}</p>
                        </div>
                    </div>
                `;
            }
        }

        // Hulpfunctie om tabellen te genereren
        function renderRittenTabel(rittenLijst) {
            if(!rittenLijst || rittenLijst.length === 0) {
                return '<p style="color: #ccc; padding: 10px;">Er zijn momenteel geen ritten geregistreerd.</p>';
            }
            
            let rows = rittenLijst.map(r => `
                <tr>
                    <td>📍 ${r.pickup_location ? r.pickup_location.substring(0,30) : 'Onbekend'}...</td>
                    <td>🏁 ${r.destination ? r.destination.substring(0,30) : 'Onbekend'}...</td>
                    <td>${r.distance_km || '0'} km</td>
                    <td><strong>SRD ${r.fare || '0.00'}</strong></td>
                    <td><span class="badge ${r.status}">${r.status}</span></td>
                </tr>
            `).join('');

            return `
                <table class="admin-table">
                    <thead><tr><th>Van</th><th>Naar</th><th>Afstand</th><th>Prijs</th><th>Status</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        // Direct laden bij openen en elke 5 seconden herhalen voor live-updates
        fetchAdminData();
        setInterval(fetchAdminData, 5000);
    </script>
</body>
</html>
