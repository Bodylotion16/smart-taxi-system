<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chauffeur Registratie - Smart Taxi</title>

    <link rel="stylesheet" href="../css/registration-driver.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="login-container registration-container">

        <h1>Chauffeur Worden</h1>

        <p class="subtitle">
            Meld je aan en begin met ritten rijden.
        </p>

        <form id="driverRegForm">

            <div class="name-row">

                <input
                    type="text"
                    id="first_name"
                    placeholder="Voornaam"
                    required
                >

                <input
                    type="text"
                    id="last_name"
                    placeholder="Achternaam"
                    required
                >

            </div>

            <input
                type="email"
                id="email"
                placeholder="E-mailadres"
                required
            >

            <input
                type="tel"
                id="phone_number"
                placeholder="Telefoonnummer"
                required
            >

            <input
                type="text"
                id="license_plate"
                placeholder="Kenteken (bijv. PA 12-34)"
                required
            >

            <input
                type="text"
                id="car_model"
                placeholder="Auto Model (bijv. Toyota Vitz)"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Wachtwoord"
                required
            >

            <button type="submit">
                Account Aanmaken
            </button>

            <p class="footer-text">
                Al een account?

                <a href="login.html" class="reg-link">
                    Log hier in
                </a>
            </p>

        </form>

    </div>

    <script src="../js/registration-driver.js"></script>

</body>
</html>
