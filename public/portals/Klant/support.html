<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support | Smart Taxi</title>

    <link rel="stylesheet" href="../../css/klant/dashboard.css">
    <link rel="stylesheet" href="../../css/klant/support.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="dashboard-container">

        <aside class="sidebar">
            <div class="logo-area">
                <h2>Klantportaal</h2>
            </div>

            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="ride-history.html" class="nav-item">Mijn ritten</a>
                <a href="../sub-pages/payment.html" class="nav-item">Betalingen</a>
                <a href="review.html" class="nav-item">Review</a>
                <a href="profile.html" class="nav-item">Mijn profiel</a>
                <a href="settings.html" class="nav-item">Instellingen</a>
                <a href="support.html" class="nav-item active">Support</a>

                <a href="../../auth/login.html" class="nav-item logout-link" id="logoutBtn">Uitloggen</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <h2 class="page-title">Support</h2>
            </div>

            <p class="subtitle">Heb je een probleem met een rit, betaling of je account? Stuur ons een bericht.</p>

            <div class="dashboard-grid">

                <div class="content-panel panel-glow">
                    <h3>Bericht sturen</h3>
                    
                    <form id="supportForm" class="quick-form">
                        <div class="input-group">
                            <label for="supportSubject">Onderwerp</label>
                            <input type="text" id="supportSubject" placeholder="Bijv. probleem met betaling of verloren voorwerp" required>
                        </div>

                        <div class="input-group">
                            <label for="supportCategory">Categorie</label>
                            <select id="supportCategory" required>
                                <option value="Rit">Probleem met een rit</option>
                                <option value="Betaling">Probleem met een betaling</option>
                                <option value="Account">Account of App voorkeuren</option>
                                <option value="Overig">Overige vraag</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label for="supportMessage">Beschrijving</label>
                            <textarea id="supportMessage" rows="5" placeholder="Beschrijf je vraag of probleem zo duidelijk mogelijk." required></textarea>
                        </div>

                        <button type="submit" class="btn-primary">Bericht versturen</button>
                    </form>
                </div>

                <div class="content-panel panel-glow">
                    <h3>Mijn meldingen</h3>
                    <div id="ticketsContainer" class="tickets-list">
                        <p class="loading-text">Meldingen worden live opgehaald...</p>
                        </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../../js/Klant/support.js"></script>
</body>
</html>
