<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rit Boeken | Smart Taxi</title>

    <link rel="stylesheet" href="../css/klant.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"
    >

</head>

<body>

    <div class="booking-container">

        <h1>NIEUWE RIT</h1>

        <p class="subtitle">
            Typ je straatnaam om locaties te kiezen.
        </p>

        <div id="map"></div>

        <button id="clearMap">
            LOCATIES WISSEN
        </button>

        <form id="bookingForm">

            <div class="input-group">

                <label>
                    📍 OPHAAL LOCATIE
                </label>

                <input
                    type="text"
                    id="pickup_location"
                    placeholder="Typ je ophaallocatie of wacht op GPS..."
                    autocomplete="off"
                >

                <ul
                    id="pickup_suggestions"
                    class="suggestions-list hidden"
                ></ul>

            </div>

            <div class="input-group">

                <label>
                    🏁 BESTEMMING
                </label>

                <input
                    type="text"
                    id="destination"
                    placeholder="Typ je bestemming..."
                    autocomplete="off"
                >

                <ul
                    id="destination_suggestions"
                    class="suggestions-list hidden"
                ></ul>

            </div>

            <div class="input-group">

                <label>
                    BETAALMETHODE
                </label>

                <select id="payment_method">

                    <option value="cash">
                        Contant (Cash)
                    </option>

                    <option value="card">
                        Bankpas (Card)
                    </option>

                    <option value="online">
                        Mope / Online
                    </option>

                </select>

            </div>

            <div id="priceBox" class="price-tag">

                <div class="price-row">

                    <span>
                        Afstand:
                        <strong id="distText">
                            0
                        </strong>
                        km
                    </span>

                    <span>
                        Totaal:
                        <strong id="fareText">
                            SRD 0.00
                        </strong>
                    </span>

                </div>

            </div>

            <button
                type="button"
                id="calcBtn"
            >
                BEREKEN RITPRIJS
            </button>

            <button
                type="submit"
                id="payBtn"
                class="pay-btn hidden"
            >
                NAAR BETALING
            </button>

        </form>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script src="../js/klant.js"></script>

</body>
</html>
