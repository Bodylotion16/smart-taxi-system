<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard | Smart Taxi</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        /* CSS is 100% intact gebleven volgens jouw ontwerp */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ride-request {
            background: #1a1a1a;
            border-left: 5px solid var(--primary, #f1c40f); /* Fallback naar geel als var niet laadt */
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .price-tag {
            font-size: 1.5rem;
            color: var(--primary, #f1c40f);
            font-weight: 800;
        }

        .btn-accept { background: var(--primary, #f1c40f); color: #000; font-weight: bold; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .btn-decline { background: #e74c3c; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .pulse {
            width: 10px;
            height: 10px;
            background: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px #2ecc71;
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
    </style>
</head>
<body>

    <div class="login-container" style="max-width: 800px; text-align: left; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Dashboard</h1>
            <div>
                <span class="pulse"></span>
                <span id="liveLabel" style="color: #2ecc71; font-weight: bold;">LIVE</span>
            </div>
        </div>
        
        <p class="subtitle">Welkom terug, <span id="driverName" style="color: white;">Chauffeur</span></p>

        <div class="status-card">
            <div>
                <h4 style="margin:0;">Jouw Status</h4>
                <p style="margin:5px 0 0 0; font-size: 0.8rem; color: #ccc;" id="statusLabel">Je bent momenteel beschikbaar</p>
            </div>
            <button onclick="toggleStatus()" id="statusBtn" style="width: auto; margin: 0; padding: 10px 20px; background: #f1c40f; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;">Ga Offline</button>
        </div>

        <h3 style="margin-top: 30px; color: #f1c40f;">Nieuwe Rit Aanvragen</h3>
        
        <div id="rideRequests">
            <p style="color: #ccc;">Ritten aan het zoeken...</p>
        </div>
    </div>

    <script>
        let isOnline = true;

        // 1. Schakelen tussen online/offline status
        function toggleStatus() {
            const btn = document.getElementById('statusBtn');
            const label = document.getElementById('statusLabel');
            const pulse = document.querySelector('.pulse');
            const liveLabel = document.getElementById('liveLabel');

            if (isOnline) {
                isOnline = false;
                btn.innerText = "Ga Online";
                btn.style.background = "#555";
                btn.style.color = "#fff";
                label.innerText = "Je bent momenteel offline";
                pulse.style.background = "#e74c3c";
                pulse.style.boxShadow = "0 0 10px #e74c3c";
                liveLabel.style.color = "#e74c3c";
                liveLabel.innerText = "OFFLINE";
                document.getElementById('rideRequests').innerHTML = '<p style="color: #ccc;">Ga online om ritten te ontvangen.</p>';
            } else {
                isOnline = true;
                btn.innerText = "Ga Offline";
                btn.style.background = "#f1c40f";
                btn.style.color = "#000";
                label.innerText = "Je bent momenteel beschikbaar";
                pulse.style.background = "#2ecc71";
                pulse.style.boxShadow = "0 0 10px #2ecc71";
                liveLabel.style.color = "#2ecc71";
                liveLabel.innerText = "LIVE";
                laadRitten(); // Laad direct ritten in
            }
        }

        // 2. Haal de ritten live op uit de backend database
        async function laadRitten() {
            if (!isOnline) return; // Stop als de chauffeur offline is

            try {
                const response = await fetch('/api/available-bookings');
                const result = await response.json();
                const container = document.getElementById('rideRequests');

                if (result.success && result.bookings.length > 0) {
                    container.innerHTML = ''; // Maak leeg voor nieuwe data
                    
                    result.bookings.forEach(rit => {
                        const ritElement = document.createElement('div');
                        ritElement.className = 'ride-request';
                        ritElement.innerHTML = `
                            <div style="display: flex; justify-content: space-between;">
                                <div>
                                    <p style="color: #ccc; font-size: 0.8rem; margin: 0;">OPHAAL LOCATIE</p>
                                    <p style="font-weight: bold; margin: 5px 0 15px 0; color: #fff;">${rit.pickup_location}</p>
                                    
                                    <p style="color: #ccc; font-size: 0.8rem; margin: 0;">BESTEMMING</p>
                                    <p style="font-weight: bold; margin: 5px 0 0 0; color: #fff;">${rit.destination} (${rit.distance_km} km)</p>
                                </div>
                                <div style="text-align: right;">
                                    <p style="color: #ccc; font-size: 0.8rem; margin: 0;">TARIEF</p>
                                    <p class="price-tag">SRD ${rit.fare}</p>
                                </div>
                            </div>
                            <div style="display: flex; gap: 10px; margin-top: 20px;">
                                <button class="btn-accept" onclick="acceptRide(this, ${rit.id})">Accepteer Rit</button>
                                <button class="btn-decline" onclick="this.parentElement.parentElement.remove()">Weiger</button>
                            </div>
                        `;
                        container.appendChild(ritElement);
                    });
                } else {
                    container.innerHTML = '<p style="color: #ccc;">Er zijn momenteel geen ritten beschikbaar.</p>';
                }
            } catch (err) {
                console.error("Fout bij ophalen ritten:", err);
            }
        }

        // 3. Rit accepteren en updaten (Koppeling met database via alert voor nu)
        function acceptRide(btn, ritId) {
            btn.innerText = "BEZIG MET RIT...";
            btn.style.background = "#2ecc71";
            btn.style.color = "#fff";
            btn.disabled = true;
            
            // Verberg de 'Weiger' knop ernaast
            if(btn.nextElementSibling) {
                btn.nextElementSibling.style.display = 'none';
            }

            alert("Je hebt rit #" + ritId + " succesvol geaccepteerd! Rij veilig naar de ophaallocatie.");
        }

        // 4. Automatisch laden bij opstarten en elke 5 seconden herhalen (Polling)
        laadRitten();
        setInterval(laadRitten, 5000);
    </script>
</body>
</html>
