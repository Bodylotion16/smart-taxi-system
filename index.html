<!DOCTYPE html>
<html lang="nl">

    <link rel="stylesheet" href="public/css/login.css">

<body>

    <div class="login-container">

            <button type="submit">Aanmelden</button>
        </form>

        <p class="footer-text">Nieuw bij ons? Registreer als:</p>

        <div class="register-links">
            <a href="registration-klant.html" class="reg-link">Passagier</a>

            <span class="divider">|</span>

            <a href="registration-driver.html" class="reg-link">Chauffeur</a>
        </div>
    </div>

    <script src="public/js/login.js"></script>

</body>
</html>
